apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: fcg
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          tcpSocket:
            port: 6379
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 10
          timeoutSeconds: 3
        args:
        - --save
        - ''
        - --appendonly
        - 'no'
        - --maxmemory
        - 64mb
        - --maxmemory-policy
        - allkeys-lru
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
