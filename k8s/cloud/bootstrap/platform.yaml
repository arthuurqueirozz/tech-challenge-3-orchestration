apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        app.kubernetes.io/part-of: fcg
    spec:
      serviceAccountName: payments-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: payments-api
        image: __PAYMENTS_IMAGE__
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        envFrom:
        - configMapRef:
            name: payments-api-config
        - secretRef:
            name: payments-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
  - name: tcp
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        app.kubernetes.io/part-of: fcg
    spec:
      serviceAccountName: kong
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: kong
        image: kong:3.9.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: proxy
          containerPort: 8000
        - name: status
          containerPort: 8100
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /status
            port: status
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /status/ready
            port: status
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /status
            port: status
          periodSeconds: 10
        env:
        - name: KONG_DATABASE
          value: 'off'
        - name: KONG_DECLARATIVE_CONFIG
          value: /etc/kong/declarative/kong.json
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_ADMIN_LISTEN
          value: 'off'
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_NGINX_WORKER_PROCESSES
          value: '2'
        - name: KONG_PLUGINS
          value: jwt
        - name: KONG_PROXY_ACCESS_LOG
          value: 'off'
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_DNS_VALID_TTL
          value: '5'
        - name: KONG_DNS_ERROR_TTL
          value: '1'
        - name: KONG_DNS_NOT_FOUND_TTL
          value: '0'
        volumeMounts:
        - name: config
          mountPath: /etc/kong/declarative
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: fcg-kong-config
          items:
          - key: kong.json
            path: kong.json
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  type: NodePort
  selector:
    app: kong
  ports:
  - name: proxy
    port: 8000
    targetPort: proxy
    nodePort: 30080
  externalTrafficPolicy: Local
