apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
        app.kubernetes.io/part-of: fcg
    spec:
      serviceAccountName: sqlserver
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 1433
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          tcpSocket:
            port: 1433
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          tcpSocket:
            port: 1433
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 1433
          periodSeconds: 10
          timeoutSeconds: 3
        env:
        - name: ACCEPT_EULA
          value: Y
        - name: MSSQL_PID
          value: Developer
        - name: MSSQL_MEMORY_LIMIT_MB
          value: '2048'
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sql-bootstrap-secrets
              key: MSSQL_SA_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
      securityContext:
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        topology.kubernetes.io/zone: __AVAILABILITY_ZONE_A__
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sql-data
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  type: ClusterIP
  selector:
    app: sqlserver
  ports:
  - name: tcp
    port: 1433
    targetPort: 1433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: fcg
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 5672
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          tcpSocket:
            port: 5672
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 10
          timeoutSeconds: 3
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: fcg
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secrets
              key: RABBITMQ_DEFAULT_PASS
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
      hostname: rabbitmq
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        topology.kubernetes.io/zone: __AVAILABILITY_ZONE_A__
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbit-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fcg-platform
  labels:
    app.kubernetes.io/part-of: fcg
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
  - name: tcp
    port: 5672
    targetPort: 5672
